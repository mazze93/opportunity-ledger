name: Deploy Opportunity Ledger
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEDGER_TOKEN: ${{ secrets.LEDGER_TOKEN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$LEDGER_TOKEN" && test -n "$D1_DATABASE_ID" && test -n "$WORKER_BASE_URL"
          test "${#LEDGER_TOKEN}" -ge 32
          [[ "$D1_DATABASE_ID" =~ ^[a-f0-9-]{36}$ ]]
          [[ "$WORKER_BASE_URL" =~ ^https://[a-z0-9.-]+\.workers\.dev$ ]]
      - name: Bind provisioned D1 database
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('wrangler.jsonc')
          s = p.read_text()
          assert s.count('REPLACE_WITH_D1_DATABASE_ID') == 1
          p.write_text(s.replace('REPLACE_WITH_D1_DATABASE_ID', os.environ['D1_DATABASE_ID']))
          PY
      - name: Apply remote schema
        run: npx wrangler d1 migrations apply opportunity-ledger --remote
      - name: Deploy Worker and Workflow
        run: npx wrangler deploy
      - name: Set API/MCP bearer secret
        run: printf '%s' "$LEDGER_TOKEN" | npx wrangler secret put LEDGER_TOKEN
      - name: Smoke-test authorization and query
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            unauthorized=$(curl -sS -o /dev/null -w '%{http_code}' "$WORKER_BASE_URL/opportunities")
            authorized=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $LEDGER_TOKEN" "$WORKER_BASE_URL/opportunities?limit=1")
            if [ "$unauthorized" = 401 ] && [ "$authorized" = 200 ]; then exit 0; fi
            sleep 10
          done
          echo 'Live Worker smoke test failed' >&2
          exit 1
