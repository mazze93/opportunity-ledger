name: Deploy Opportunity Ledger
on:
  workflow_dispatch:
  push:
    branches: [deploy/cloudflare]

permissions:
  contents: read

concurrency:
  group: opportunity-ledger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check required repository secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEDGER_TOKEN: ${{ secrets.LEDGER_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LEDGER_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run test:runtime
      - name: Create or reuse D1 and R2 resources
        run: node scripts/provision.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEDGER_TOKEN: ${{ secrets.LEDGER_TOKEN }}
      - name: Migrate and deploy
        run: |
          npx wrangler d1 migrations apply opportunity-ledger --remote
          npx wrangler deploy
          printf '%s' "$LEDGER_TOKEN" | npx wrangler secret put LEDGER_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEDGER_TOKEN: ${{ secrets.LEDGER_TOKEN }}
      - name: Verify live ingestion, evidence, and MCP
        run: node scripts/verify-deployment.mjs
        env:
          LEDGER_TOKEN: ${{ secrets.LEDGER_TOKEN }}
