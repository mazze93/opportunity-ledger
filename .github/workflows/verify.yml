name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:runtime
      - name: Desk typecheck, tests and bundle (no deploy)
        run: |
          npx tsc -p desk/tsconfig.json
          node --experimental-strip-types --no-warnings --test desk/test/*.test.ts
          npx wrangler deploy -c desk/wrangler.jsonc --dry-run --outdir dist/desk
